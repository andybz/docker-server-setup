[Definition]

# Each ban is applied in two places:
#   1. iptables/ip6tables FORWARD chain - drops the attacker's direct connections
#      to Docker's published ports (Docker traffic never reaches INPUT).
#   2. an nginx deny list, included by NPM via server_proxy.conf - needed for
#      sites proxied through Cloudflare, where iptables only sees Cloudflare.
#      npmReload.path reloads NPM whenever these lists change.

actionstart = mkdir -p /nginx-deny && : > /nginx-deny/<name>.conf

actionstop = : > /nginx-deny/<name>.conf

actionban = if echo "<ip>" | grep -q ':'; then ip6tables -I FORWARD -s <ip> -j DROP; else iptables -I FORWARD -s <ip> -j DROP; fi
            grep -qxF 'deny <ip>;' /nginx-deny/<name>.conf || echo 'deny <ip>;' >> /nginx-deny/<name>.conf

actionunban = if echo "<ip>" | grep -q ':'; then ip6tables -D FORWARD -s <ip> -j DROP; else iptables -D FORWARD -s <ip> -j DROP; fi
              grep -vxF 'deny <ip>;' /nginx-deny/<name>.conf > /nginx-deny/<name>.conf.tmp; mv /nginx-deny/<name>.conf.tmp /nginx-deny/<name>.conf
