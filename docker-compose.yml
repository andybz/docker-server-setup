# ~/server/docker-compose.yml
# Secrets and settings come from ~/server/.env (created by setup.sh, mode 600).

networks:
  proxy:
    # shared with every site; named after your username (e.g. "andy")
    name: ${USERNAME}
    external: true
  database:
    external: true

volumes:
  mariadb:

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:6900:9000

  mariadb:
    # official image: sets the root password for every root account and
    # upgrades its system tables automatically after a version bump
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    networks:
      - proxy
      - database
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'
      TZ: ${TZ}
      # nginx proxy manager database
      MARIADB_DATABASE: npm
      MARIADB_USER: npm
      MARIADB_PASSWORD: ${NPM_DB_PASSWORD}
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    # official image: built on php:*-apache, so PHP security fixes land quickly.
    # Log in with a database user (e.g. root and MARIADB_ROOT_PASSWORD from .env);
    # there is deliberately no auto-login.
    image: phpmyadmin:5
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - database
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 256M
      TZ: ${TZ}
    ports:
      - 127.0.0.1:6902:80
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '127.0.0.1:6901:81' # Admin Web Port
    environment:
      DB_MYSQL_HOST: mariadb
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      DB_MYSQL_NAME: npm
      TZ: ${TZ}
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  filebrowser:
    image: hurlenko/filebrowser
    container_name: filebrowser
    # nobody user, matching the WordPress containers
    user: '65534:65534'
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - 127.0.0.1:6903:8080
    volumes:
      - ../sites:/data
      - ./filebrowser/config:/config
    environment:
      - FB_BASEURL=/

  watchtower:
    # maintained fork; containrrr/watchtower is abandoned and can't talk to Docker 29+
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
      WATCHTOWER_POLL_INTERVAL: 3600
      WATCHTOWER_CLEANUP: 'true'
      # only containers labelled com.centurylinklabs.watchtower.enable=true are
      # updated: phpMyAdmin and every site (see wordpress/docker-compose.yml).
      # Update the rest deliberately: andybz -> Update Server Containers
      WATCHTOWER_LABEL_ENABLE: 'true'

  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - 127.0.0.1:6905:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    hostname: fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ}
      - F2B_DB_PURGE_AGE=3d
    volumes:
      - ./fail2ban/data:/data
      - ./npm/data/logs:/var/log/npm
      - ./wp-fail2ban.log:/var/log/wp-fail2ban.log
      # nginx deny lists for bans on Cloudflare-proxied domains
      - ./npm/data/nginx/custom/f2b:/nginx-deny
