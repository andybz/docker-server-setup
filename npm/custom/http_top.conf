# Example http_top.conf for optional GeoIP country blocking (see GEOIP-SETUP.md).
# Not installed by setup.sh: it needs the GeoLite2 database mounted first, or
# nginx fails to start.
#
# Cloudflare real-IP ranges are not needed here: NPM maintains them itself in
# its built-in ip_ranges.conf.

# ---------------------------------------------------
# GeoIP2 Country lookup
# ---------------------------------------------------
geoip2 /etc/geoip/GeoLite2-Country.mmdb {
    auto_reload 24h;
    $geoip2_country_code default=XX country iso_code;
}

# Map country codes to allow/deny
# 1 = blocked, 0 = allowed
map $geoip2_country_code $blocked_country {
    default 0;
    CN 1;
    RU 1;
    KP 1;
    DE 1;
}
