# Included in every proxy host's server block. Installed by setup.sh into
# ~/server/npm/data/nginx/custom/server_proxy.conf

# Restore the visitor IP for requests proxied through Cloudflare. NPM's base
# config uses X-Real-IP, which Cloudflare doesn't send. This only applies to
# trusted sources (Cloudflare ranges in NPM's own ip_ranges.conf), so it can't
# be spoofed by direct visitors.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# fail2ban bans (deny <ip>;), written by fail2ban/data/action.d/npm-firewall-block.conf.
# Needed for Cloudflare-proxied domains, where the iptables DROP can't see the visitor IP.
include /data/nginx/custom/f2b/*.conf;

# GeoIP country blocking (optional, see GEOIP-SETUP.md) adds:
#   if ($blocked_country) { return 403; }
